name: Recuperar cartas de Apify

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restaurar histórico
        uses: actions/cache/restore@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Recuperar platos
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RECOVER_DATASETS: USweTMlgSrsr9abEE,hXxaJZaEhbVOfxhTz,ErkCCk936LeWbJaTO,aT0zGZ9lkBWlNTErK
        run: python scripts/recover_menus.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: recuperar cartas de Apify $(date -u +%F)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "No se pudo empujar el commit de recuperación" >&2
              exit 1
            fi
          fi

      - name: Publicar en Google Doc
        if: ${{ always() && vars.GDOC_ID != '' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GDOC_ID: ${{ vars.GDOC_ID }}
        run: python -m maps_gluten publish

      - name: Guardar histórico
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartas-recuperadas
          path: |
            data/mis_lugares_sin_gluten.md
            data/mis_lugares_sin_gluten.jsonl
            data/mis_lugares_sin_gluten_menus.jsonl
          if-no-files-found: warn
          retention-days: 30
