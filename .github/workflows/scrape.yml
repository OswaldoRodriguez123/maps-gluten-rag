name: Actualizar lista de Google Maps

on:
  schedule:
    - cron: "0 16,17 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la lista (opcional; usa la variable del repositorio si se omite)"
        required: false
      refresh_place:
        description: "Forzar enriquecido de un local (nombre parcial, ej: Crumbless)"
        required: false

permissions:
  contents: write

concurrency:
  group: maps-gluten
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Comprobar 13:00 en Chile
        id: check
        run: |
          hora=$(TZ=America/Santiago date +%H)
          echo "Hora en Chile: $hora"
          if [ "$hora" = "13" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: hora
    if: github.event_name == 'workflow_dispatch' || needs.hora.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAPS_LIST_URL: ${{ github.event.inputs.url || vars.MAPS_LIST_URL || 'https://maps.app.goo.gl/FWzyQ6w2AYSDTZZYA' }}
      MAPS_TIMEZONE: America/Santiago
      MAPS_LOCALE: es-CL
      MAPS_HEADLESS: "0"
      MAPS_BROWSER_CHANNEL: ""
      MAPS_OUT_DIR: data
      MAPS_OUT_BASENAME: mis_lugares_sin_gluten
      MAPS_ENRICH: "1"
      MAPS_ENRICH_DAYS: "30"
      MAPS_OCR: "1"
      MAPS_VISION: "1"
      MAPS_VISION_PLACES: "12"
      MAPS_VISION_PHOTOS: "3"
      MAPS_VISION_CONCURRENCY: "2"
      MAPS_APIFY: "1"
      MAPS_MENU_ACTOR: "unitbytes"
      MAPS_WEBSITE_MENU: "0"
      APIFY_LANGUAGE: "es"
      APIFY_MAX_PHOTOS: "8"
      APIFY_MAX_CHARGE_USD: "2.0"
      APIFY_CONCURRENCY: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache de paquetes del sistema
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: xvfb tesseract-ocr tesseract-ocr-spa
          version: 1.0

      - name: Dependencias del sistema
        run: python -m playwright install-deps chromium

      - name: Cache de Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Chromium
        run: python -m playwright install chromium

      - name: Restaurar histórico
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Sincronizar SQLite desde JSONL
        run: python scripts/sync_db_from_jsonl.py --db data/historial_lugares.db

      - name: Extraer lista
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          REFRESH_PLACE: ${{ github.event.inputs.refresh_place }}
        run: |
          args=()
          if [ -n "$REFRESH_PLACE" ]; then
            args+=(--refresh-place "$REFRESH_PLACE")
          fi
          xvfb-run -a python -m maps_gluten run "${args[@]}"

      - name: Normalizar cartas y etiquetas
        run: |
          python scripts/normalize_menus.py --places data/mis_lugares_sin_gluten.jsonl --menus data/mis_lugares_sin_gluten_menus.jsonl --out-dir data/normalized
          python scripts/apply_normalization.py --places data/mis_lugares_sin_gluten.jsonl --normalized-dir data/normalized --out-dir data --db data/historial_lugares.db
          python scripts/rebuild_markdown.py
          rm -rf data/normalized

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar lista $(date -u +%F)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "No se pudo empujar el commit de datos" >&2
              exit 1
            fi
          fi

      - name: Publicar en Google Doc
        if: ${{ always() && vars.GDOC_ID != '' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GDOC_ID: ${{ vars.GDOC_ID }}
        run: python -m maps_gluten publish

      - name: Guardar histórico
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapas-sin-gluten
          path: |
            data/mis_lugares_sin_gluten.md
            data/mis_lugares_sin_gluten.jsonl
            data/mis_lugares_sin_gluten_menus.jsonl
          if-no-files-found: warn
          retention-days: 30
