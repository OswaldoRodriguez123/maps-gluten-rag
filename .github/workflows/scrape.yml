name: Actualizar lista de Google Maps

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL de la lista (opcional; usa la variable del repositorio si se omite)"
        required: false

permissions:
  contents: write

concurrency:
  group: maps-gluten
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAPS_LIST_URL: ${{ github.event.inputs.url || vars.MAPS_LIST_URL || 'https://maps.app.goo.gl/FWzyQ6w2AYSDTZZYA' }}
      MAPS_TIMEZONE: America/Bogota
      MAPS_LOCALE: es-CO
      MAPS_HEADLESS: "1"
      MAPS_BROWSER_CHANNEL: ""
      MAPS_OUT_DIR: data
      MAPS_OUT_BASENAME: mis_lugares_sin_gluten

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restaurar histórico
        uses: actions/cache@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Extraer lista
        run: python -m maps_gluten run

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar lista $(date -u +%F)"
            git push
          fi

      - name: Publicar en Google Doc
        if: ${{ vars.GDOC_ID != '' }}
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GDOC_ID: ${{ vars.GDOC_ID }}
        run: python -m maps_gluten publish

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: mapas-sin-gluten
          path: |
            data/mis_lugares_sin_gluten.md
            data/mis_lugares_sin_gluten.jsonl
          retention-days: 30
