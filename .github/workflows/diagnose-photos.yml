name: Diagnosticar fotos de un local

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Texto a buscar en placeName"
        required: true
        default: "Gata Negra"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar datasets de UnitBytes
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PLACE: ${{ inputs.place }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API = "https://api.apify.com/v2"
          TOKEN = os.environ["APIFY_TOKEN"]
          QUERY = os.environ["PLACE"].lower()

          def get(path):
              sep = "&" if "?" in path else "?"
              url = f"{API}{path}{sep}token={TOKEN}"
              with urllib.request.urlopen(url, timeout=120) as response:
                  return json.load(response)

          actor = "unitbytes~google-maps-photos-scraper"
          print("=== input schema (category) ===")
          try:
              schema = get(f"/acts/{actor}/input-schema")
              props = (schema.get("data") or {}).get("properties") or schema.get("properties") or {}
              print(json.dumps(props.get("category"), ensure_ascii=False)[:800])
          except Exception as error:
              print("schema error", error)

          print("=== últimas corridas ===")
          runs = get(f"/acts/{actor}/runs?limit=12&desc=1").get("data", {}).get("items", [])
          for run in runs:
              print(
                  run.get("startedAt"), run.get("status"),
                  "dataset", run.get("defaultDatasetId"),
                  "charge", run.get("usageTotalUsd"),
              )

          for run in runs:
              if run.get("status") != "SUCCEEDED":
                  continue
              dataset = run.get("defaultDatasetId")
              if not dataset:
                  continue
              try:
                  items = get(
                      f"/datasets/{dataset}/items?format=json&clean=true&limit=10000"
                  )
              except Exception as error:
                  print("dataset error", dataset, error)
                  continue
              if isinstance(items, dict):
                  items = items.get("items", [])
              matches = [
                  item for item in items
                  if QUERY in (item.get("placeName") or "").lower()
                  or QUERY in (item.get("placeMapsUrl") or "").lower()
              ]
              print(f"\n--- dataset {dataset}: {len(items)} items, {len(matches)} de {QUERY} ---")
              if matches:
                  for item in matches[:30]:
                      print(json.dumps({
                          "placeName": item.get("placeName"),
                          "placeCid": item.get("placeCid"),
                          "placeMapsUrl": (item.get("placeMapsUrl") or "")[:80],
                          "photoCategory": item.get("photoCategory"),
                          "caption": item.get("caption"),
                          "photoUrl": (item.get("photoUrl") or "")[:90],
                          "photoUrlHighRes": (item.get("photoUrlHighRes") or "")[:90],
                      }, ensure_ascii=False))
                  break
              # distribución de categorías del dataset
              counts = {}
              for item in items:
                  key = item.get("photoCategory")
                  counts[key] = counts.get(key, 0) + 1
              print("categorías:", counts)
          PY