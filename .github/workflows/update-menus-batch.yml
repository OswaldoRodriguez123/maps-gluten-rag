name: Actualizar cartas de varios locales

on:
  workflow_dispatch:
    inputs:
      places:
        description: "Lista separada por comas"
        required: true
        default: "ALLFREE,Biomercado,BuganVilla,Crumbless,Rebelde"
      refresh:
        description: "Volver a raspar fotos (ignora la caché)"
        type: boolean
        default: false
      ocr:
        description: "Usar Tesseract además de Gemini"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-menus-batch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tesseract
        if: ${{ inputs.ocr }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr tesseract-ocr-spa
          version: 1.0

      - name: Restaurar histórico
        uses: actions/cache/restore@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Actualizar cartas
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDOC_ID: ${{ vars.GDOC_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLACES: ${{ inputs.places }}
          REFRESH: ${{ inputs.refresh }}
          OCR: ${{ inputs.ocr }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then
            args+=(--refresh-photos)
          fi
          if [ "$OCR" != "true" ]; then
            args+=(--no-ocr)
          fi
          IFS=',' read -ra list <<< "$PLACES"
          for place in "${list[@]}"; do
            place="$(echo "$place" | xargs)"
            [ -z "$place" ] && continue
            echo "===== $place ====="
            python scripts/update_menu_place.py \
              --place "$place" --db data/historial_lugares.db --publish "${args[@]}" \
              || echo "SIN CARTA: $place"
          done

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar cartas de varios locales $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Guardar histórico
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}