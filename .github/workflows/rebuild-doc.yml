name: Reconstruir Doc

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-doc
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruir y publicar
        env:
          GDOC_ID: ${{ vars.GDOC_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python scripts/rebuild_markdown.py --publish

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mis_lugares_sin_gluten.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "docs: carta por plato $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
