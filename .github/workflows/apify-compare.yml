name: Comparar actores de menú

on:
  workflow_dispatch:
    inputs:
      place1:
        description: "Primer local (URL de Maps)"
        required: false
        default: "https://www.google.com/maps?cid=10920287372200639195"
      place2:
        description: "Segundo local (URL de Maps)"
        required: false
        default: "https://www.google.com/maps?cid=9130566955029176875"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nomad vs UnitBytes
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PLACE1: ${{ inputs.place1 }}
          PLACE2: ${{ inputs.place2 }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["APIFY_TOKEN"]
          PLACES = [os.environ["PLACE1"], os.environ["PLACE2"]]
          API = "https://api.apify.com/v2"

          def call(path, method="GET", payload=None):
              url = f"{API}{path}"
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def run_actor(actor, actor_input, cap=0.1, timeout=600):
              query = urllib.parse.urlencode(
                  {"timeout": timeout, "maxTotalChargeUsd": cap}
              )
              run = call(
                  f"/acts/{actor}/runs?{query}", method="POST", payload=actor_input
              )["data"]
              deadline = time.time() + timeout + 120
              while time.time() < deadline:
                  run = call(f"/actor-runs/{run['id']}")["data"]
                  if run.get("status") in {"SUCCEEDED", "TIMED-OUT", "FAILED", "ABORTED"}:
                      break
                  time.sleep(10)
              items = call(
                  f"/datasets/{run['defaultDatasetId']}/items?format=json&clean=true&limit=10000"
              )
              if isinstance(items, dict):
                  items = items.get("items", [])
              return run, items

          print("=== NOMAD (platos estructurados) ===")
          run, items = run_actor(
              "nomad-agent~google-maps-menu-scraper-managed",
              {"placeUrls": PLACES, "language": "es", "maxMenuPhotos": 8},
              cap=0.10,
              timeout=900,
          )
          dishes = [item for item in items if item.get("recordType") == "DISH"]
          print("status:", run.get("status"), "| filas:", len(items), "| platos:", len(dishes), "| USD:", run.get("usageTotalUsd"))
          for dish in dishes[:10]:
              print(" ", dish.get("place"), "|", dish.get("name"), "|", dish.get("price"), "|", dish.get("category"), "|", dish.get("allergens"))

          print("=== UNITBYTES (fotos de menú + captions) ===")
          run, items = run_actor(
              "unitbytes~google-maps-photos-scraper",
              {"placeUrls": PLACES, "category": "menu", "maxPhotos": 8, "highResOnly": True, "scrapePhotos": True},
              cap=0.10,
              timeout=900,
          )
          print("status:", run.get("status"), "| filas:", len(items), "| USD:", run.get("usageTotalUsd"))
          if items:
              print("campos:", sorted(items[0].keys()))
          for item in items[:15]:
              print(" ", item.get("placeName"), "|", item.get("photoCategory"), "|", item.get("caption"), "|", (item.get("photoUrlHighRes") or "")[:80])
          PY
