name: Inspeccionar datasets de Apify

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resumen de corridas y datasets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter

          TOKEN = os.environ["APIFY_TOKEN"]
          API = "https://api.apify.com/v2"

          def call(path):
              request = urllib.request.Request(
                  f"{API}{path}", headers={"Authorization": f"Bearer {TOKEN}"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          runs = call("/actor-runs?desc=true&limit=20")["data"]["items"]
          for run in runs:
              if run.get("status") not in {"SUCCEEDED", "TIMED-OUT", "FAILED", "ABORTED"}:
                  continue
              dataset_id = run.get("defaultDatasetId")
              if not dataset_id:
                  continue
              try:
                  items = call(
                      f"/datasets/{dataset_id}/items?format=json&clean=true&limit=10000"
                  )
              except Exception as error:
                  print(run.get("id"), "dataset error", error)
                  continue
              if isinstance(items, dict):
                  items = items.get("items", [])
              kinds = Counter(
                  item.get("recordType", "PHOTO" if item.get("photoUrl") else "?")
                  for item in items
              )
              dishes = [item for item in items if item.get("recordType") == "DISH"]
              print(
                  run.get("id"),
                  "| act", run.get("actId"),
                  "|", run.get("status"),
                  "| filas", len(items),
                  "|", dict(kinds),
                  "| USD", run.get("usageTotalUsd"),
              )
              for dish in dishes[:2]:
                  print("   dish:", dish.get("place"), "|", dish.get("name"), "|", dish.get("price"))
              for item in items:
                  if item.get("recordType") not in {"DISH", None}:
                      print("   diag:", json.dumps(item, ensure_ascii=False)[:300])
                      break
          PY
