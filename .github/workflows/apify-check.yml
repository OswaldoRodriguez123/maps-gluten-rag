name: Comprobar token de Apify

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token y ver corridas
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("APIFY_TOKEN", "").strip()
          if not token:
              raise SystemExit("APIFY_TOKEN está vacío")

          def get(path):
              request = urllib.request.Request(
                  "https://api.apify.com/v2" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          me = get("/users/me")["data"]
          plan = me.get("plan") or {}
          print("Token válido para:", me.get("username"))
          print("Plan:", plan.get("id"), "| crédito mensual:", plan.get("monthlyUsageCreditsUsd"))

          for path in ("/users/me/usage", "/users/me/limits", "/users/me/billing"):
              try:
                  data = get(path)
                  print(path, "=>", json.dumps(data, ensure_ascii=False)[:1200])
              except Exception as error:
                  print(path, "ERR", error)

          runs = get("/actor-runs?desc=true&limit=10")["data"]
          items = runs.get("items", [])
          print("Corridas recientes:", len(items))
          for item in items:
              print(
                  item.get("id"),
                  "| act", item.get("actId"),
                  "|", item.get("status"),
                  "|", item.get("startedAt"),
                  "->", item.get("finishedAt"),
                  "| USD", item.get("usageTotalUsd"),
                  "| dataset", item.get("defaultDatasetId"),
              )
          PY
