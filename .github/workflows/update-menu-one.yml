name: Actualizar carta de un local

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Nombre parcial del local (ej: Yoko)"
        required: true
        default: "Yoko"
      refresh:
        description: "Volver a raspar fotos (ignora la caché)"
        type: boolean
        default: false
      ocr:
        description: "Usar Tesseract además de Gemini (más lento)"
        type: boolean
        default: false

concurrency:
  group: update-menu-one
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tesseract
        if: ${{ inputs.ocr }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr tesseract-ocr-spa
          version: 1.0

      - name: Restaurar histórico
        uses: actions/cache/restore@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Actualizar carta
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDOC_ID: ${{ vars.GDOC_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLACE: ${{ inputs.place }}
          REFRESH: ${{ inputs.refresh }}
          OCR: ${{ inputs.ocr }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then
            args+=(--refresh-photos)
          fi
          if [ "$OCR" != "true" ]; then
            args+=(--no-ocr)
          fi
          python scripts/update_menu_place.py --place "$PLACE" --db data/historial_lugares.db --publish "${args[@]}"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar carta de $PLACE $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Guardar histórico
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
