name: Diagnóstico de fotos recuperables

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar fotos ya raspadas
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API = "https://api.apify.com/v2"
          TOKEN = os.environ["APIFY_TOKEN"]
          ACTOR = "unitbytes~google-maps-photos-scraper"

          def get(path):
              sep = "&" if "?" in path else "?"
              url = f"{API}{path}{sep}token={TOKEN}"
              with urllib.request.urlopen(url, timeout=120) as response:
                  return json.load(response)

          places = []
          for line in open("data/mis_lugares_sin_gluten.jsonl", encoding="utf-8"):
              record = json.loads(line)
              metadata = record["metadata"]
              places.append(
                  {
                      "id": record["id"],
                      "name": metadata["name"],
                      "menu": metadata.get("menu_count") or 0,
                  }
              )

          runs = get(f"/acts/{ACTOR}/runs?limit=30&desc=1").get("data", {}).get("items", [])
          print(f"corridas revisadas: {len(runs)}")
          photos = {}
          seen_datasets = set()
          for run in runs:
              if run.get("status") != "SUCCEEDED":
                  continue
              dataset = run.get("defaultDatasetId")
              if not dataset or dataset in seen_datasets:
                  continue
              seen_datasets.add(dataset)
              try:
                  items = get(
                      f"/datasets/{dataset}/items?format=json&clean=true&limit=10000"
                  )
              except Exception:
                  continue
              if isinstance(items, dict):
                  items = items.get("items", [])
              for item in items:
                  if item.get("photoCategory") not in {"menu", None, ""}:
                      continue
                  cid = str(item.get("placeCid") or "").lower()
                  url = item.get("photoUrlHighRes") or item.get("photoUrl")
                  if cid and url:
                      photos.setdefault(cid, []).append(url)

          print(f"datasets con fotos: {len(seen_datasets)}; locales con fotos: {len(photos)}")
          recoverable = []
          for place in places:
              if place["menu"] > 0:
                  continue
              urls = photos.get(place["id"].lower()) or []
              if urls:
                  recoverable.append((place["name"], len(urls), place["id"]))
          recoverable.sort(key=lambda row: -row[1])
          print(f"\n=== SIN CARTA PERO CON FOTOS DISPONIBLES: {len(recoverable)} ===")
          for name, count, cid in recoverable:
              print(f"{count:2} fotos | {name} | {cid}")
          print("\n=== SIN CARTA Y SIN FOTOS ===")
          no_photos = [
              place["name"] for place in places
              if place["menu"] == 0 and not photos.get(place["id"].lower())
          ]
          for name in no_photos:
              print(f"- {name}")
          PY