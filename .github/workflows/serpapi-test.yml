name: Test SerpAPI search

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Nombre del lugar (ej: ALLFREE)"
        required: true
        default: "ALLFREE"
      address:
        description: "Dirección (opcional)"
        required: false
        default: "Av. Apoquindo 7474, Las Condes"

concurrency:
  group: serpapi-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test search_website en vivo
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACE: ${{ inputs.place }}
          ADDRESS: ${{ inputs.address }}
        run: |
          python -c '
          import os
          name = os.environ["PLACE"]
          address = os.environ["ADDRESS"] or None
          serp = os.environ.get("SERPAPI_KEY", "").strip()
          gemini = os.environ.get("GEMINI_API_KEY", "").strip()
          print("SERPAPI_KEY:", "SET len=" + str(len(serp)) if serp else "NOT_SET")
          print("GEMINI_API_KEY:", "SET len=" + str(len(gemini)) if gemini else "NOT_SET")
          if not serp or not gemini:
              raise SystemExit("Falta secret — revisa Settings > Secrets")
          from maps_gluten.website_search import search_website
          url, score, status, platforms = search_website(
              name, address, api_key=gemini, timeout=15
          )
          print("official_url:", url)
          print("score:", score)
          print("status:", status)
          print("platform_urls:", platforms)
          if status in ("no_serpapi_key", "no_search_key"):
              raise SystemExit("Las keys no llegaron al entorno")
          '
