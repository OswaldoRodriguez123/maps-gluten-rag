name: Probar UnitBytes + OCR

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Probar 2 locales
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".")
          from maps_gluten.extract import Place
          from maps_gluten.photos import enrich_menus_photos

          places = [
              Place(
                  ftid="q",
                  name="QUIMEY SUSHI FUSION & GLUTEN FREE",
                  address="Guardia Vieja 450, Providencia",
                  category=None,
                  rating=None,
                  reviews=None,
                  note=None,
                  url="https://www.google.com/maps?cid=10920287372200639195",
              ),
              Place(
                  ftid="z",
                  name="Cafe Zoliakie Gluten Free",
                  address="Av. Providencia 2546, Providencia",
                  category=None,
                  rating=None,
                  reviews=None,
                  note=None,
                  url="https://www.google.com/maps?cid=9130566955029176875",
              ),
          ]

          total = enrich_menus_photos(
              places,
              os.environ["APIFY_TOKEN"],
              max_photos=8,
              max_charge_usd=0.2,
              today="2026-11-05",
          )
          print("TOTAL platillos:", total)
          for place in places:
              print("====", place.name, "|", place.menu_at)
              print((place.menu_dishes or "")[:1500])
          PY
