name: Actualizar carta Fudo de un local

on:
  workflow_dispatch:
    inputs:
      place:
        description: "Nombre parcial del local"
        required: true
        default: "Café Aquelarre"
      menu_url:
        description: "URL menu.fu.do (opcional si está en data/menu_urls.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-menu-one
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Dependencias del sistema
        run: python -m playwright install-deps chromium

      - name: Chromium
        run: python -m playwright install chromium

      - name: Restaurar histórico
        uses: actions/cache/restore@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
          restore-keys: maps-gluten-db-

      - name: Actualizar carta Fudo
        env:
          GDOC_ID: ${{ vars.GDOC_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PLACE: ${{ inputs.place }}
          MENU_URL: ${{ inputs.menu_url }}
        run: |
          args=()
          if [ -n "$MENU_URL" ]; then
            args+=(--menu-url "$MENU_URL")
          fi
          python scripts/update_menu_place.py \
            --place "$PLACE" --fudo --db data/historial_lugares.db --publish "${args[@]}"

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: carta Fudo de ${{ inputs.place }} $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Guardar histórico
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/historial_lugares.db
          key: maps-gluten-db-${{ github.run_id }}
