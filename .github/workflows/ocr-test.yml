name: Probar OCR de fotos de menú

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: UnitBytes + OCR de Zoliakie
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          mkdir -p ocr-photos
          python - <<'PY'
          import io
          import os
          import sys
          import urllib.request

          import pytesseract
          from PIL import Image, ImageOps

          sys.path.insert(0, ".")
          from maps_gluten.photos import _fetch_items, _start_run, _wait_run

          TOKEN = os.environ["APIFY_TOKEN"]
          PLACE = "https://www.google.com/maps?cid=9130566955029176875"

          run = _start_run(TOKEN, [PLACE], max_photos=20, max_charge=0.1, timeout=600)
          print("run", run["id"])
          completed = _wait_run(TOKEN, run["id"], 900)
          print("status", completed.get("status"))
          dataset = completed.get("defaultDatasetId") or run.get("defaultDatasetId")
          items = _fetch_items(TOKEN, dataset) if dataset else []
          print("items", len(items))

          for index, item in enumerate(items):
              url = item.get("photoUrlHighRes") or item.get("photoUrl")
              print(f"\n--- foto {index} | {item.get('photoCategory')} | {item.get('imageWidth')}x{item.get('imageHeight')}")
              if not url:
                  continue
              try:
                  with urllib.request.urlopen(url, timeout=40) as response:
                      raw = response.read(20_000_000)
              except Exception as error:
                  print("download error:", error)
                  continue
              with open(f"ocr-photos/zoliakie-{index}.jpg", "wb") as handle:
                  handle.write(raw)
              image = Image.open(io.BytesIO(raw)).convert("L")
              if image.width < 1800:
                  ratio = 1800 / max(image.width, 1)
                  image = image.resize((int(image.width * ratio), int(image.height * ratio)), Image.LANCZOS)
              elif image.width > 2600:
                  ratio = 2600 / image.width
                  image = image.resize((int(image.width * ratio), int(image.height * ratio)), Image.LANCZOS)
              image = ImageOps.autocontrast(image)
              for psm in (6, 11, 3):
                  try:
                      text = pytesseract.image_to_string(image, lang="spa+eng", config=f"--psm {psm}")
                  except Exception as error:
                      print(f"psm{psm} error:", error)
                      continue
                  print(f"psm{psm} len:", len(text.strip()))
                  print(text.strip().replace("\n", " | ")[:900])
          PY

      - name: Guardar fotos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-fotos-zoliakie
          path: ocr-photos
          if-no-files-found: warn
